<!doctype html>
<html lang="nl" data-thema="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="style-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0d11">
  <title>Tapteller – klassement</title>

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/scherm.css">
</head>
<body class="scherm">
  <main class="bord">
    <header class="bord__kop">
      <div class="merk">
        <img class="merk__logo" id="logo" alt="" hidden>
        <div>
          <p class="merk__evenement" id="evenement" hidden></p>
          <h1 class="merk__titel" id="titel">Klassement</h1>
        </div>
      </div>
      <p class="totaal">
        <span class="totaal__getal" id="totaal">0</span>
        <span class="totaal__label">punten in totaal</span>
      </p>
    </header>

    <section class="grafiek" id="grafiek" role="list" aria-label="Klassement"></section>

    <footer class="bord__voet">
      <time class="klok" id="klok"></time>
      <button class="knop knop--spook knop--klein" id="volScherm" type="button">Volledig scherm</button>
    </footer>
  </main>

  <div class="gif" id="gif" hidden aria-live="polite">
    <figure class="gif__kaart">
      <img class="gif__beeld" alt="">
      <figcaption class="gif__onderschrift">
        <span class="gif__naam"></span>
        <span class="gif__punten"></span>
      </figcaption>
    </figure>
  </div>

  <script type="module" src="assets/js/scherm/main.js"></script>
</body>
</html>
