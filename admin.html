<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="style-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <title>Tapteller – beheer</title>

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">
  <div class="meldingen" id="meldingen" role="status" aria-live="polite"></div>

  <p class="laden" id="weergave-laden">Laden…</p>

  <main class="inloggen" id="weergave-inloggen" hidden>
    <img class="inloggen__merk" src="assets/img/merk.svg" alt="">
    <h1 class="inloggen__titel">Tapteller</h1>
    <p class="inloggen__uitleg">Log in als beheerder om te tellen en te beheren.</p>

    <form class="formulier" id="inlogformulier">
      <div class="veld">
        <label class="veld__label" for="email">E-mailadres</label>
        <input class="invoer" id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div class="veld">
        <label class="veld__label" for="wachtwoord">Wachtwoord</label>
        <input class="invoer" id="wachtwoord" name="wachtwoord" type="password" autocomplete="current-password" required>
      </div>
      <button class="knop knop--primair knop--blok" type="submit">Inloggen</button>
    </form>

    <div class="inloggen__fout" id="inlogfout" role="alert" hidden></div>
  </main>

  <div class="app" id="weergave-app" hidden>
    <header class="app__kop">
      <div class="app__balk">
        <img class="app__merk" src="assets/img/merk.svg" alt="">
        <p class="app__naam" id="evenementnaam">Tapteller</p>
        <button class="knop knop--spook knop--klein knop--icoon" id="uitloggen" type="button" aria-label="Uitloggen" title="Uitloggen"></button>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Onderdelen"></nav>
    </header>

    <main class="app__inhoud" id="inhoud" tabindex="-1"></main>
    <aside class="mand" id="mand" aria-label="Huidige bestelling" hidden></aside>
  </div>

  <script type="module" src="assets/js/admin/main.js"></script>
</body>
</html>
