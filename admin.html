<!doctype html>
<html lang="nl" class="volgt-thema">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tapteller – admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍻</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:2.4rem;line-height:1;margin:16px 0 4px;font-weight:900}
.sub{color:var(--muted);margin:0 0 20px}
.status{padding:12px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);margin-bottom:16px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
form,.stack{display:flex;flex-direction:column;gap:10px}
input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.btn{padding:12px 16px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:transparent;color:var(--minus);border:2px solid var(--line)}
.groups{display:flex;flex-direction:column;gap:10px}
.g{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px}
.g .kop{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.g .name{flex:1;font-weight:700;font-size:1.2rem;overflow-wrap:anywhere}
.g .count{font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.g .count small{font-family:"Barlow",sans-serif;font-size:.8rem;font-weight:600;color:var(--muted);margin-left:4px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.punt{height:68px;border-radius:12px;border:0;font-weight:700;line-height:1.1;transition:transform .08s}
.punt b{display:block;font-family:"Big Shoulders Display",Impact,sans-serif;font-size:1.8rem;font-weight:900}
.punt:active{transform:scale(.95)}
.punt.gewoon{background:var(--accent);color:var(--accent-ink)}
.punt.zwaar{background:var(--minus);color:#fff}
.g.bump{animation:bump .4s ease-out}
@keyframes bump{0%{border-color:var(--accent)}100%{border-color:var(--line)}}
.undo{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px;width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700}
.undo:disabled{opacity:.4}
.leeg{padding:28px 20px;text-align:center;border:2px dashed var(--line);border-radius:16px;color:var(--muted)}
details{margin-top:28px;border-top:2px solid var(--line);padding-top:12px}
summary{font-weight:700;cursor:pointer;padding:8px 0}
.row{display:flex;gap:6px;align-items:center;margin:8px 0}
.row input{flex:1;min-width:0}
.note{color:var(--muted);font-size:.9rem}
.beheer-item{border:2px solid var(--line);border-radius:16px;padding:10px;margin:10px 0;background:var(--surface)}
.beheer-item .row{margin:0}
.fotorij{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.mini{width:48px;height:48px;border-radius:50%;background:#fff center/cover no-repeat;border:2px solid var(--line);flex:none}
.mini.geen{background:transparent;border-style:dashed}
.g .mini{width:44px;height:44px}
.logo-voorbeeld{width:100%;max-width:320px;height:120px;border-radius:12px;border:2px dashed var(--line);background:#16245C center/contain no-repeat;margin:8px 0}
</style>
</head>
<body>
<main>
  <div class="top">
    <div>
      <h1>Tapteller</h1>
      <p class="sub" id="sub">Log in als admin om te tellen en groepen te beheren.</p>
    </div>
    <button class="btn ghost hidden" id="logout">Uitloggen</button>
  </div>
  <div class="status hidden" id="status"></div>

  <form id="login" class="hidden">
    <input type="email" id="email" placeholder="E-mailadres" autocomplete="username" required>
    <input type="password" id="pw" placeholder="Wachtwoord" autocomplete="current-password" required>
    <button class="btn" type="submit">Inloggen</button>
  </form>

  <section id="app" class="hidden">
    <div class="groups" id="groups"></div>
    <button class="undo" id="undo" disabled>Niets om ongedaan te maken</button>

    <details>
      <summary>Groepen beheren</summary>
      <div class="row">
        <input id="nieuw" placeholder="Naam van de groep" maxlength="40" autocomplete="off">
        <button class="btn" id="toevoegen">Toevoegen</button>
      </div>
      <div class="beheer-item">
        <strong>Logo van het evenement</strong>
        <div class="logo-voorbeeld" id="logoVoorbeeld"></div>
        <div class="fotorij">
          <button class="btn ghost" id="logoKiezen">Logo kiezen</button>
          <button class="btn ghost hidden" id="logoWeg">Logo weghalen</button>
        </div>
      </div>
      <div id="beheer"></div>
      <input type="file" id="fotoKiezer" accept="image/*" class="hidden">
      <div class="row"><button class="btn danger" id="reset">Alle tellingen op 0 zetten</button></div>
      <p class="note">Wijzigingen zijn meteen zichtbaar op het scherm.</p>
    </details>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, get, set, push, update, remove, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "./config.js";

const $ = id => document.getElementById(id);
const status = msg => { $("status").textContent = msg || ""; $("status").classList.toggle("hidden", !msg); };

let app, db, auth;
try {
  app = initializeApp(firebaseConfig);
  db = getDatabase(app); auth = getAuth(app);
} catch (e) {
  status("Firebase is nog niet ingesteld. Vul config.js in.");
  throw e;
}

let groepen = {};
let stopLuisteren = null;

onAuthStateChanged(auth, async user => {
  stopLuisteren?.(); stopLuisteren = null;
  stopLogo?.(); stopLogo = null;
  $("logout").classList.toggle("hidden", !user);
  if (!user){
    $("login").classList.remove("hidden"); $("app").classList.add("hidden");
    $("sub").textContent = "Log in als admin om te tellen en groepen te beheren.";
    return;
  }
  $("login").classList.add("hidden");
  let isAdmin = false;
  try { isAdmin = (await get(ref(db, "admins/" + user.uid))).val() === true; } catch (e) {}
  if (!isAdmin){
    status("Dit account is geen admin. Voeg deze UID toe onder ‘admins’ in de database: " + user.uid);
    return;
  }
  status("");
  $("sub").textContent = "Gewone consumptie = 1 punt, zwaar bier = 3 punten.";
  $("app").classList.remove("hidden");
  stopLogo = luisterLogo();
  stopLuisteren = onValue(ref(db, "groepen"), s => { groepen = s.val() || {}; render(); },
    () => status("Verbinding verbroken. Herlaad de pagina."));
});

$("login").addEventListener("submit", async e => {
  e.preventDefault();
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pw").value); status(""); }
  catch (err) { status("Inloggen lukte niet. Controleer je e-mailadres en wachtwoord."); }
});
$("logout").onclick = () => signOut(auth);

const fout = () => status("Opslaan lukte niet. Controleer je verbinding.");

const geschiedenis = []; // laatste tikken op dit toestel, om ongedaan te maken

function tel(id, punten, soort){
  update(ref(db), { [`groepen/${id}/aantal`]: increment(punten) })
    .then(() => { geschiedenis.push({ id, punten, soort }); if (geschiedenis.length > 50) geschiedenis.shift(); toonUndo(); })
    .catch(fout);
  const el = document.querySelector('.g[data-id="' + id + '"]');
  if (el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
}

function toonUndo(){
  const l = geschiedenis[geschiedenis.length - 1];
  const b = $("undo");
  if (!l || !groepen[l.id]){ b.disabled = true; b.textContent = "Niets om ongedaan te maken"; return; }
  b.disabled = false;
  b.textContent = `Ongedaan maken: ${l.soort} bij ${groepen[l.id].naam} (−${l.punten})`;
}

$("undo").onclick = () => {
  const l = geschiedenis.pop(); if (!l) return;
  const huidig = groepen[l.id]?.aantal | 0;
  const terug = Math.min(l.punten, huidig);
  if (terug > 0) update(ref(db), { [`groepen/${l.id}/aantal`]: increment(-terug) }).catch(fout);
  toonUndo();
};

function gesorteerd(){
  return Object.entries(groepen).map(([id, g]) => ({ id, ...g }))
    .sort((a, b) => (a.t || 0) - (b.t || 0));
}

function render(){
  const lijst = gesorteerd();
  const $g = $("groups"); $g.textContent = "";
  if (!lijst.length){
    const e = document.createElement("div"); e.className = "leeg";
    e.textContent = "Nog geen groepen. Open ‘Groepen beheren’ hieronder en voeg de eerste toe.";
    $g.appendChild(e);
  }
  lijst.forEach(g => {
    const row = document.createElement("div"); row.className = "g"; row.dataset.id = g.id;
    const kop = document.createElement("div"); kop.className = "kop";
    const n = document.createElement("div"); n.className = "name"; n.textContent = g.naam;
    const c = document.createElement("div"); c.className = "count"; c.textContent = g.aantal | 0;
    const sm = document.createElement("small"); sm.textContent = "punten"; c.appendChild(sm);
    kop.append(miniFoto(g.foto), n, c);
    const b = document.createElement("div"); b.className = "btns";
    const p1 = document.createElement("button"); p1.className = "punt gewoon";
    p1.innerHTML = "<b>+1</b>Consumptie";
    p1.setAttribute("aria-label", "Gewone consumptie voor " + g.naam + ", 1 punt");
    p1.onclick = () => tel(g.id, 1, "consumptie");
    const p3 = document.createElement("button"); p3.className = "punt zwaar";
    p3.innerHTML = "<b>+3</b>Zwaar bier";
    p3.setAttribute("aria-label", "Zwaar bier voor " + g.naam + ", 3 punten");
    p3.onclick = () => tel(g.id, 3, "zwaar bier");
    b.append(p1, p3); row.append(kop, b); $g.appendChild(row);
  });
  toonUndo();
  renderBeheer(lijst);
}

function miniFoto(foto){
  const d = document.createElement("div");
  d.className = "mini" + (foto ? "" : " geen");
  if (foto && foto.startsWith("data:image/")) d.style.backgroundImage = 'url("' + foto.replace(/"/g, "") + '")';
  return d;
}

// Verklein een gekozen afbeelding, zodat ze klein genoeg is voor de database.
function verklein(bestand, max = 320, grens = 350000){
  return new Promise((ok, nok) => {
    const url = URL.createObjectURL(bestand);
    const img = new Image();
    img.onload = () => {
      const schaal = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * schaal), h = Math.round(img.height * schaal);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let data = cv.toDataURL("image/png");          // behoudt transparantie (logo’s)
      if (data.length > grens){                      // te groot: jpg met witte achtergrond
        const cv2 = document.createElement("canvas"); cv2.width = w; cv2.height = h;
        const c2 = cv2.getContext("2d"); c2.fillStyle = "#fff"; c2.fillRect(0, 0, w, h); c2.drawImage(cv, 0, 0);
        data = cv2.toDataURL("image/jpeg", 0.85);
      }
      ok(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); nok(new Error("Deze afbeelding kan niet gelezen worden")); };
    img.src = url;
  });
}

function renderBeheer(lijst){
  const $b = $("beheer");
  if ($b.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return; // niet wissen terwijl je typt
  $b.textContent = "";
  lijst.forEach(g => {
    const item = document.createElement("div"); item.className = "beheer-item";
    const row = document.createElement("div"); row.className = "row";
    const inp = document.createElement("input"); inp.value = g.naam; inp.maxLength = 40;
    inp.setAttribute("aria-label", "Naam van " + g.naam);
    const save = document.createElement("button"); save.className = "btn ghost"; save.textContent = "Opslaan";
    save.onclick = () => {
      const v = inp.value.trim(); if (!v || v === g.naam) return;
      update(ref(db, "groepen/" + g.id), { naam: v }).then(() => inp.blur()).catch(fout);
    };
    row.append(inp, save);

    const fr = document.createElement("div"); fr.className = "fotorij";
    const kiesBtn = document.createElement("button"); kiesBtn.className = "btn ghost";
    kiesBtn.textContent = g.foto ? "Andere foto" : "Foto kiezen";
    kiesBtn.onclick = () => { fotoVoor = g.id; kiezer.click(); };
    fr.append(miniFoto(g.foto), kiesBtn);
    if (g.foto){
      const weg = document.createElement("button"); weg.className = "btn ghost"; weg.textContent = "Foto weghalen";
      weg.onclick = () => remove(ref(db, "groepen/" + g.id + "/foto")).catch(fout);
      fr.appendChild(weg);
    }
    const del = document.createElement("button"); del.className = "btn danger"; del.textContent = "Groep verwijderen";
    del.onclick = () => {
      if (confirm(`‘${g.naam}’ verwijderen? De telling van deze groep verdwijnt.`))
        remove(ref(db, "groepen/" + g.id)).catch(fout);
    };
    fr.appendChild(del);

    item.append(row, fr); $b.appendChild(item);
  });
}

const kiezer = $("fotoKiezer");
let fotoVoor = null;
kiezer.onchange = async () => {
  const f = kiezer.files && kiezer.files[0];
  const id = fotoVoor;
  kiezer.value = "";
  if (!f || !id) return;
  status(id === "__logo" ? "Logo wordt opgeslagen…" : "Foto wordt opgeslagen…");
  try {
    if (id === "__logo"){
      const data = await verklein(f, 800, 1200000);
      await set(ref(db, "instellingen/logo"), data);
    } else {
      const data = await verklein(f);
      await update(ref(db, "groepen/" + id), { foto: data });
    }
    status("");
  } catch (e) {
    status("Foto opslaan lukte niet: " + ((e && (e.code || e.message)) || "onbekende fout"));
  }
};

$("logoKiezen").onclick = () => { fotoVoor = "__logo"; kiezer.click(); };
$("logoWeg").onclick = () => {
  if (confirm("Logo weghalen? Op het scherm komt dan de tekst in de plaats."))
    remove(ref(db, "instellingen/logo")).catch(fout);
};
function luisterLogo(){
  return onValue(ref(db, "instellingen/logo"), s => {
    const v = s.val();
    const ok = typeof v === "string" && v.startsWith("data:image/");
    $("logoVoorbeeld").style.backgroundImage = ok ? 'url("' + v.replace(/"/g, "") + '")' : "";
    $("logoWeg").classList.toggle("hidden", !ok);
    $("logoKiezen").textContent = ok ? "Ander logo" : "Logo kiezen";
  }, () => {});
}
let stopLogo = null;

async function toevoegen(){
  const v = $("nieuw").value.trim(); if (!v) return;
  try { await push(ref(db, "groepen"), { naam: v, aantal: 0, t: Date.now() }); $("nieuw").value = ""; }
  catch (e) { fout(); }
}
$("toevoegen").onclick = toevoegen;
$("nieuw").addEventListener("keydown", e => { if (e.key === "Enter") toevoegen(); });

$("reset").onclick = () => {
  if (!confirm("Alle tellingen op 0 zetten? Dit kan niet ongedaan gemaakt worden.")) return;
  const u = {};
  Object.keys(groepen).forEach(id => u[`groepen/${id}/aantal`] = 0);
  update(ref(db), u).catch(fout);
};
</script>
</body>
</html>
